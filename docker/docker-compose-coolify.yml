# ==============================================================================
# Deploy na Coolify (recurso "Docker Compose" apontando para este arquivo).
#
# - Domínios: defina na Coolify o domínio do serviço "frontend" (painel) e do
#   "backend" (API). As variáveis SERVICE_FQDN_* abaixo são preenchidas por ela.
# - Segredos: SERVICE_PASSWORD_* são gerados pela Coolify. SUPER_ADMIN_EMAIL,
#   SUPER_ADMIN_PASSWORD e CORS_ORIGINS precisam ser definidos na aba de variáveis
#   (sem padrão). Com ENVIRONMENT=production o backend se recusa a subir sem eles.
# - Postgres 17 para casar com o pg_dump 17 da imagem do backend (backups).
# - Vídeo nunca passa por aqui: o navegador envia e baixa direto do storage S3/R2.
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vturb
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: vturb
    volumes:
      - vturb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vturb -d vturb"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.prod
    restart: unless-stopped
    environment:
      SERVICE_FQDN_BACKEND_8000: ${SERVICE_FQDN_BACKEND_8000}
      ENVIRONMENT: production
      # Domínio do painel (ex.: https://painel.seudominio.com). Sem isso o backend não sobe.
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://vturb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vturb
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${SERVICE_PASSWORD_64_JWT}
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-24}
      # Storage S3 (Cloudflare R2): vídeos e capas vão direto do navegador para o bucket
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      # Domínio público do bucket (ex.: https://video.seudominio.com), servido pela CDN da Cloudflare
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      HLS_ENABLED: "${HLS_ENABLED:-true}"
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-4294967296}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Smart VSL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M

  # Consolida métricas (e, na fase de HLS, processa os vídeos). Mesma imagem do backend.
  worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.prod
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://vturb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vturb
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${SERVICE_PASSWORD_64_JWT}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      HLS_ENABLED: "${HLS_ENABLED:-true}"
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-90}
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # ffmpeg abre um encoder por qualidade: o teto real de CPU é este limite.
          # Pico medido: ~700 MiB num 1080p de 150s (4 qualidades); folga para fontes maiores.
          cpus: "2"
          memory: 1536M

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.prod
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${SERVICE_FQDN_BACKEND}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  vturb_postgres_data:
