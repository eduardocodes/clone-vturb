version: "3.8"

services:
  # ============================================================================
  # Backend API (FastAPI + SQLAlchemy + Uvicorn Multi-Workers)
  # ============================================================================
  backend:
    image: ${BACKEND_IMAGE:-aryalvesfernandes/clone-vturb:backend-1.0.8}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.prod
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:?defina CORS_ORIGINS com o dominio do painel}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@vturb.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?defina SUPER_ADMIN_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?defina JWT_SECRET_KEY (openssl rand -hex 32)}
      - JWT_ACCESS_TOKEN_EXPIRE_HOURS=${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-24h}
      - BACKBLAZE_KEY_ID=${BACKBLAZE_KEY_ID:-}
      - BACKBLAZE_APPLICATION_KEY=${BACKBLAZE_APPLICATION_KEY:-}
      - BACKBLAZE_BUCKET_NAME=${BACKBLAZE_BUCKET_NAME:-}
      - BACKBLAZE_ENDPOINT_URL=${BACKBLAZE_ENDPOINT_URL:-}
      - BACKBLAZE_CDN_URL=${BACKBLAZE_CDN_URL:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@vturb.com}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Smart VSL}
    volumes:
      - backend_uploads:/app/static/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.vturb_backend.rule=Host(`${BACKEND_DOMAIN:-api.seudominio.com}`)
        - traefik.http.routers.vturb_backend.entrypoints=websecure
        - traefik.http.routers.vturb_backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.vturb_backend.service=vturb_backend
        - traefik.http.services.vturb_backend.loadbalancer.server.port=8000
        - traefik.http.services.vturb_backend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.vturb_backend.middlewares=sslheader@docker

  # ============================================================================
  # Frontend SPA (React + Vite + Nginx Alpine)
  # ============================================================================
  frontend:
    image: ${FRONTEND_IMAGE:-aryalvesfernandes/clone-vturb:frontend-1.0.8}
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${BACKEND_DOMAIN:-api.seudominio.com}}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      # Só a URL da API: o frontend é público e não pode receber segredos do backend
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://${BACKEND_DOMAIN:-api.seudominio.com}}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.vturb_frontend.rule=Host(`${FRONTEND_DOMAIN:-app.seudominio.com}`)
        - traefik.http.routers.vturb_frontend.entrypoints=websecure
        - traefik.http.routers.vturb_frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.vturb_frontend.service=vturb_frontend
        - traefik.http.services.vturb_frontend.loadbalancer.server.port=80
        - traefik.http.services.vturb_frontend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.vturb_frontend.middlewares=sslheader@docker

volumes:
  backend_uploads:
    name: vturb_backend_uploads_prod

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
