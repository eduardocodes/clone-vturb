name: projetovturb

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vturb_user
      POSTGRES_PASSWORD: vturb_password
      POSTGRES_DB: vturb_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vturb_user -d vturb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vturb_user:vturb_password@postgres:5432/vturb_db
      # Storage S3 local (SeaweedFS). O navegador usa localhost:8333; o backend, a rede do Docker.
      STORAGE_ENDPOINT_URL: http://seaweedfs:8333
      STORAGE_PRESIGN_ENDPOINT_URL: http://localhost:8333
      STORAGE_ACCESS_KEY_ID: vturbdev
      STORAGE_SECRET_ACCESS_KEY: vturbdevsecret
      STORAGE_BUCKET: vturb-dev
      STORAGE_PUBLIC_URL: http://localhost:8333/vturb-dev
      STORAGE_REGION: us-east-1
    ports:
      - "8003:8000"
    volumes:
      - ../backend:/app
      # Composes de deploy visíveis para os testes de configuração
      - ../docker:/docker:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5175:5175"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Storage S3 local (faz o papel do Cloudflare R2 / Backblaze B2 em dev).
  # API S3 em http://localhost:8333, bucket "vturb-dev", leitura anônima liberada.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs-init
    restart: "no"
    depends_on:
      - seaweedfs
    entrypoint: ["sh", "-c"]
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 2; done
        echo "s3.bucket.create -name vturb-dev" | weed shell -master=seaweedfs:9333 || true

volumes:
  postgres_data:
    name: projetovturb_postgres_data
  seaweedfs_data:
    name: projetovturb_seaweedfs_data
